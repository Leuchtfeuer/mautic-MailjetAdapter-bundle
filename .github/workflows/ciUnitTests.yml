name: CI Workflow

on:
  pull_request:

jobs:
  ci-workflow:
    name: CI
    uses: Leuchtfeuer/mautic-ci-runner/.github/workflows/complete-ci.yaml@main
    with:
      mauticVersion: 5
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}